<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Session Loader</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f2f4f5; 
            font-family: Arial, sans-serif;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #333;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- This iframe actually loads Roblox -->
    <iframe src="https://www.roblox.com/" style="border:none; width:100%; height:100%;"></iframe>
    
    <script>
        // Optional: You can add logic here if you want to notify Node.js 
        // that the page has fully loaded, but Playwright's waitForLoadState usually handles it.
        console.log("Roblox tab is ready.");
    </script>
</body>
</html>
