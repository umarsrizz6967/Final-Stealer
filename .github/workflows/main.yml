name: Browser Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright-core install chromium --with-deps

      - name: Run Script
        run: node index.js
