name: Local Roblox Cookie Fetcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fetch-cookie:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Script
        run: node index.js
