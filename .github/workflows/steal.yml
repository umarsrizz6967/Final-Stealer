name: Fetch Roblox Cookie

on:
  # Run this manually when you click "Run workflow"
  workflow_dispatch:

jobs:
  fetch-cookie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm init -y && npm install playwright-core

      - name: Install Browser
        run: npx playwright-core install chromium

      - name: Run Script
        run: node index.js
        env:
          # If your API needs a key, put it here:
          API_KEY: ${{ secrets.API_KEY }}
