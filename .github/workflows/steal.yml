name: Fetch Roblox Cookie

on:
  workflow_dispatch:

jobs:
  fetch-cookie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install playwright-core

      - name: Decode Chrome Profile
        env:
          PROFILE_ZIP: ${{ secrets.CHROME_PROFILE_ZIP }}
        run: |
          echo "$PROFILE_ZIP" > chrome-profile.b64
          base64 -d chrome-profile.b64 > chrome-profile.zip
          mkdir -p /tmp/chrome-profile
          unzip -o chrome-profile.zip -d /tmp/chrome-profile/
          # Adjust this path based on your zip structure
          export CHROME_PROFILE_PATH="/tmp/chrome-profile/User Data" 

      - name: Run Stealer
        env:
          CHROME_PROFILE_PATH: ${{ env.CHROME_PROFILE_PATH }}
        run: node index.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: roblox-token
          path: ./roblox_token.txt
